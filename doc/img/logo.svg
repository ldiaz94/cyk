<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>cyk</title>
  <defs>
    <linearGradient id="cyk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c20"/>
      <stop offset="100%" stop-color="#09140e"/>
    </linearGradient>
    <linearGradient id="cyk-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyk-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <clipPath id="cyk-frame">
      <rect x="4" y="4" width="120" height="120" rx="20"/>
    </clipPath>
  </defs>

  <!-- Frame -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#cyk-bg)" stroke="#275038" stroke-width="2"/>

  <g clip-path="url(#cyk-frame)">
    <!-- 8-bit baseline & braille audio track -->
    <line x1="6" y1="104" x2="122" y2="104" stroke="#173827" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Braille terminal spectrum dots (authentic 2x4 cells) -->
    <g fill="#34d399" opacity="0.65">
      <!-- Cell 1 -->
      <circle cx="12" cy="101" r="1"/><circle cx="14.5" cy="101" r="1"/>
      <circle cx="12" cy="105" r="1"/><circle cx="14.5" cy="105" r="1"/>
      <circle cx="12" cy="109" r="1"/><circle cx="14.5" cy="109" r="1"/>

      <!-- Cell 2 -->
      <circle cx="21" cy="97" r="1"/><circle cx="23.5" cy="97" r="1"/>
      <circle cx="21" cy="101" r="1"/><circle cx="23.5" cy="101" r="1"/>
      <circle cx="21" cy="105" r="1"/><circle cx="23.5" cy="105" r="1"/>
      <circle cx="21" cy="109" r="1"/><circle cx="23.5" cy="109" r="1"/>

      <!-- Cell 3 -->
      <circle cx="30" cy="105" r="1"/><circle cx="32.5" cy="105" r="1"/>
      <circle cx="30" cy="109" r="1"/><circle cx="32.5" cy="109" r="1"/>

      <!-- Cell 4 -->
      <circle cx="39" cy="93" r="1"/><circle cx="41.5" cy="93" r="1"/>
      <circle cx="39" cy="97" r="1"/><circle cx="41.5" cy="97" r="1"/>
      <circle cx="39" cy="101" r="1"/><circle cx="41.5" cy="101" r="1"/>
      <circle cx="39" cy="105" r="1"/><circle cx="41.5" cy="105" r="1"/>
      <circle cx="39" cy="109" r="1"/><circle cx="41.5" cy="109" r="1"/>

      <!-- Cell 5 -->
      <circle cx="48" cy="101" r="1"/><circle cx="50.5" cy="101" r="1"/>
      <circle cx="48" cy="105" r="1"/><circle cx="50.5" cy="105" r="1"/>
      <circle cx="48" cy="109" r="1"/><circle cx="50.5" cy="109" r="1"/>

      <!-- Cell 6 -->
      <circle cx="57" cy="105" r="1"/><circle cx="59.5" cy="105" r="1"/>
      <circle cx="57" cy="109" r="1"/><circle cx="59.5" cy="109" r="1"/>

      <!-- Cell 7 -->
      <circle cx="66" cy="89" r="1"/><circle cx="68.5" cy="89" r="1"/>
      <circle cx="66" cy="93" r="1"/><circle cx="68.5" cy="93" r="1"/>
      <circle cx="66" cy="97" r="1"/><circle cx="68.5" cy="97" r="1"/>
      <circle cx="66" cy="101" r="1"/><circle cx="68.5" cy="101" r="1"/>
      <circle cx="66" cy="105" r="1"/><circle cx="68.5" cy="105" r="1"/>
      <circle cx="66" cy="109" r="1"/><circle cx="68.5" cy="109" r="1"/>

      <!-- Cell 8 -->
      <circle cx="75" cy="97" r="1"/><circle cx="77.5" cy="97" r="1"/>
      <circle cx="75" cy="101" r="1"/><circle cx="77.5" cy="101" r="1"/>
      <circle cx="75" cy="105" r="1"/><circle cx="77.5" cy="105" r="1"/>
      <circle cx="75" cy="109" r="1"/><circle cx="77.5" cy="109" r="1"/>

      <!-- Cell 9 -->
      <circle cx="84" cy="93" r="1"/><circle cx="86.5" cy="93" r="1"/>
      <circle cx="84" cy="97" r="1"/><circle cx="86.5" cy="97" r="1"/>
      <circle cx="84" cy="101" r="1"/><circle cx="86.5" cy="101" r="1"/>
      <circle cx="84" cy="105" r="1"/><circle cx="86.5" cy="105" r="1"/>
      <circle cx="84" cy="109" r="1"/><circle cx="86.5" cy="109" r="1"/>

      <!-- Cell 10 -->
      <circle cx="93" cy="101" r="1"/><circle cx="95.5" cy="101" r="1"/>
      <circle cx="93" cy="105" r="1"/><circle cx="95.5" cy="105" r="1"/>
      <circle cx="93" cy="109" r="1"/><circle cx="95.5" cy="109" r="1"/>

      <!-- Cell 11 -->
      <circle cx="102" cy="105" r="1"/><circle cx="104.5" cy="105" r="1"/>
      <circle cx="102" cy="109" r="1"/><circle cx="104.5" cy="109" r="1"/>

      <!-- Cell 12 -->
      <circle cx="111" cy="97" r="1"/><circle cx="113.5" cy="97" r="1"/>
      <circle cx="111" cy="101" r="1"/><circle cx="113.5" cy="101" r="1"/>
      <circle cx="111" cy="105" r="1"/><circle cx="113.5" cy="105" r="1"/>
    </g>

    <!-- 8-bit stepped square-wave -->
    <path d="M6 104 H17 V97 H27 V105 H38 V92 H51 V104 H64 V86 H77 V97 H89 V92 H100 V105 H110 V96 H122"
          stroke="#fbbf24" stroke-width="2" fill="none" stroke-linejoin="miter"/>

    <!-- Antennae, sweeping back over Cyk -->
    <path d="M65 33 C61 17 43 11 25 15 C15 18 9 25 7 35"
          stroke="#86efac" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M68 32 C63 12 45 6 27 10 C16 13 11 20 8 29"
          stroke="#4ade80" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Hind leg: femur (strong cricket thigh) -->
    <path d="M44 68 C38 60 27 48 23 44 C20 41 22 47 31 66 C36 75 42 76 46 73 z"
          fill="#15803d"/>
    <path d="M42 66 C36 58 27 47 24 44"
          stroke="#86efac" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Hind leg: tibia folding down, foot standing on step C -->
    <path d="M23 44 L27 88 L30 105 L35 105"
          stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Tibia spurs -->
    <path d="M25 60 l-3 1.5 M26 68 l-3 1.5 M27 76 l-3 1.5"
          stroke="#86efac" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Abdomen underside (segmented plates) -->
    <path d="M34 66 C28 72 27 82 32 87 C36 91 44 89 50 82 z" fill="url(#cyk-belly)"/>
    <path d="M31 75 q4 2 8 0 M33 81 q4 2 7 0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Forewing / tegmen (amber stridulating cover) -->
    <path d="M41 54 C34 62 33 76 38 83 C42 87 52 85 58 76 C63 68 63 57 53 51 z"
          fill="url(#cyk-wing)"/>
    <!-- Stridulatory harp & veins (source of the cricket's chirp) -->
    <path d="M45 56 C39 64 39 74 45 80 M51 58 C46 66 45 73 50 77 M56 62 C52 68 51 73 55 75"
          stroke="#fde68a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Middle leg, standing on step D -->
    <path d="M52 62 L46 76 L44 92 L48 92"
          stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Left front leg, perched on high step F -->
    <path d="M58 60 L62 74 L66 86 L70 86"
          stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Thorax (pronotum) -->
    <path d="M50 48 C50 43 56 41 63 43 C67 45 68 54 66 61 C61 65 53 64 50 59 z"
          fill="#16a34a"/>
    <path d="M53 47 C57 44 63 45 65 48" stroke="#86efac" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Head -->
    <circle cx="67" cy="43" r="11" fill="#22c55e"/>
    <path d="M60 41 C62 35 69 34 74 37" stroke="#86efac" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheek blush (warm amber glow) -->
    <ellipse cx="66" cy="49" rx="3.5" ry="2" fill="#f59e0b" opacity="0.45"/>
    <!-- Cheerful smile -->
    <path d="M72 48 Q74 50 76 48" stroke="#15803d" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- The Eye (alert, charming, glossy) -->
    <ellipse cx="71" cy="40" rx="4.2" ry="4.4" fill="#07120a"/>
    <circle cx="72.5" cy="38.5" r="1.6" fill="#ffffff"/>
    <circle cx="69.8" cy="41.5" r="0.8" fill="#ffffff" opacity="0.85"/>

    <!-- Right arm holding the tuning fork -->
    <path d="M64 54 C72 58 80 57 86 52"
          stroke="#22c55e" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="52" r="2.2" fill="#15803d"/>

    <!-- Tuning Fork (crisp, precision-aligned silver) -->
    <!-- stem with base knob -->
    <line x1="86" y1="58" x2="86" y2="42" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="86" cy="59.5" r="1.6" fill="#cbd5e1"/>
    <!-- U-curve base -->
    <path d="M83 38 C83 43 89 43 89 38" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Prongs -->
    <line x1="83" y1="38" x2="83" y2="22" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="89" y1="38" x2="89" y2="22" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Sound vibrations radiating from the prongs -->
    <path d="M78 20 C75 23 75 27 78 30" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M74 17 C70 22 70 28 74 33" stroke="#fbbf24" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M94 20 C97 23 97 27 94 30" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M98 17 C102 22 102 28 98 33" stroke="#fbbf24" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Musical sparkle / "cyk" tick -->
    <path d="M86 15 L86 19 M84 17 L88 17" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
